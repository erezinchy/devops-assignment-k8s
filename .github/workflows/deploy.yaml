name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/env/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Spin up an ephemeral cluster so this pipeline is a real,
      # reproducible deploy test — not just a syntax check.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-demo

      - name: Install ingress-nginx on kind
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      # Apply on main only — PRs stop at plan for review
      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Verify rollout
        if: github.ref == 'refs/heads/main'
        run: kubectl rollout status deployment/demo-app -n demo-dev --timeout=90s