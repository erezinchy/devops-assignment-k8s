<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Production Architecture — 30 Microservices, 500rps, 99.9% Availability</text>

  <!-- Clients -->
  <rect x="520" y="55" width="160" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="600" y="80" font-size="13" text-anchor="middle">Clients</text>

  <!-- Route53 -->
  <rect x="480" y="120" width="240" height="45" rx="6" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="600" y="140" font-size="13" text-anchor="middle" font-weight="bold">Route53</text>
  <text x="600" y="157" font-size="11" text-anchor="middle">weighted / latency routing</text>

  <!-- Arrows client->r53 -->
  <line x1="600" y1="95" x2="600" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Region A -->
  <rect x="140" y="200" width="420" height="500" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="350" y="222" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">Region A</text>

  <!-- Region B -->
  <rect x="640" y="200" width="420" height="500" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="850" y="222" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">Region B (standby/failover)</text>

  <!-- Arrows r53 -> regions -->
  <line x1="540" y1="165" x2="350" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="165" x2="850" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ALB in Region A -->
  <rect x="255" y="245" width="190" height="40" rx="6" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="350" y="270" font-size="12" text-anchor="middle">ALB (multi-AZ)</text>

  <!-- ALB in Region B -->
  <rect x="755" y="245" width="190" height="40" rx="6" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="850" y="270" font-size="12" text-anchor="middle">ALB (multi-AZ)</text>

  <!-- EKS cluster Region A -->
  <rect x="165" y="305" width="370" height="330" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="350" y="327" font-size="12" font-weight="bold" text-anchor="middle">EKS Cluster (multi-AZ node groups)</text>
  <text x="350" y="342" font-size="10" text-anchor="middle" fill="#333">topology spread + affinity/anti-affinity across AZs</text>
  <text x="350" y="356" font-size="10" text-anchor="middle" fill="#333">taints/tolerations isolate stateful/critical workloads</text>

  <!-- AZ boxes -->
  <rect x="180" y="368" width="160" height="90" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1"/>
  <text x="260" y="384" font-size="11" text-anchor="middle" font-weight="bold">AZ-1</text>
  <text x="260" y="400" font-size="10" text-anchor="middle">ns: team-a</text>
  <text x="260" y="414" font-size="10" text-anchor="middle">ns: team-b</text>
  <text x="260" y="428" font-size="10" text-anchor="middle">15 microservices</text>
  <text x="260" y="444" font-size="9" text-anchor="middle" fill="#666">rolling updates</text>

  <rect x="360" y="368" width="160" height="90" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1"/>
  <text x="440" y="384" font-size="11" text-anchor="middle" font-weight="bold">AZ-2</text>
  <text x="440" y="400" font-size="10" text-anchor="middle">ns: team-c</text>
  <text x="440" y="414" font-size="10" text-anchor="middle">ns: customer-x</text>
  <text x="440" y="428" font-size="10" text-anchor="middle">15 microservices</text>
  <text x="440" y="444" font-size="9" text-anchor="middle" fill="#666">maxUnavailable=0</text>

  <!-- Autoscaling row -->
  <rect x="180" y="470" width="340" height="55" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
  <text x="350" y="490" font-size="11" text-anchor="middle" font-weight="bold">Autoscaling</text>
  <text x="350" y="505" font-size="10" text-anchor="middle">HPA (CPU/mem) · VPA (pod sizing) · KEDA (RabbitMQ queue depth)</text>

  <!-- Data layer -->
  <rect x="180" y="540" width="340" height="80" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.2"/>
  <text x="350" y="560" font-size="11" text-anchor="middle" font-weight="bold">Managed Data Layer (shared, Multi-AZ)</text>
  <text x="260" y="580" font-size="10" text-anchor="middle">RDS PostgreSQL</text>
  <text x="440" y="580" font-size="10" text-anchor="middle">ElastiCache Redis</text>
  <text x="350" y="598" font-size="10" text-anchor="middle">Amazon MQ (RabbitMQ)</text>

  <!-- Env note (applies to whole diagram, not Region A specifically) -->
  <rect x="330" y="632" width="540" height="55" rx="6" fill="#fce4ec" stroke="#d81b60" stroke-width="1"/>
  <text x="600" y="652" font-size="10" text-anchor="middle" font-weight="bold">Diagram above = Production only (multi-region, for 99.9% SLA)</text>
  <text x="600" y="668" font-size="10" text-anchor="middle">Dev/Staging: single-region, separate clusters or namespaces — no HA needed, lower cost</text>

  <!-- Mirror EKS cluster Region B (simplified) -->
  <rect x="665" y="305" width="370" height="330" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="850" y="327" font-size="12" font-weight="bold" text-anchor="middle">EKS Cluster (warm standby, scaled down)</text>
  <text x="850" y="342" font-size="10" text-anchor="middle" fill="#333">same 30 services, minimal replicas — scales up on failover</text>

  <rect x="680" y="368" width="160" height="90" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1"/>
  <text x="760" y="384" font-size="11" text-anchor="middle" font-weight="bold">AZ-1</text>
  <text x="760" y="400" font-size="10" text-anchor="middle">15 svc, min replicas</text>

  <rect x="860" y="368" width="160" height="90" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1"/>
  <text x="940" y="384" font-size="11" text-anchor="middle" font-weight="bold">AZ-2</text>
  <text x="940" y="400" font-size="10" text-anchor="middle">15 svc, min replicas</text>

  <rect x="680" y="470" width="340" height="55" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
  <text x="850" y="490" font-size="11" text-anchor="middle" font-weight="bold">Autoscaling</text>
  <text x="850" y="505" font-size="10" text-anchor="middle">HPA (CPU/mem) · VPA (pod sizing) · KEDA (RabbitMQ queue depth)</text>

  <rect x="680" y="540" width="340" height="80" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.2"/>
  <text x="850" y="560" font-size="11" text-anchor="middle" font-weight="bold">Managed Data Layer (Multi-AZ)</text>
  <text x="850" y="580" font-size="10" text-anchor="middle">RDS · Redis · RabbitMQ (cross-region replica)</text>

  <!-- arrows ALB->EKS -->
  <line x1="350" y1="285" x2="350" y2="305" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="285" x2="850" y2="305" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sensitive data note -->
  <text x="600" y="745" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">Sensitive customer data: namespace-per-customer, or cluster-per-customer where regulation requires stricter isolation</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
